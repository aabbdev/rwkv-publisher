[project]
name = "rwkv-publisher"
version = "0.2.0"
description = "Build and publish auditable native RWKV model repositories"
readme = "README.md"
authors = [
    { name = "Lucas", email = "30107107+aabbdev@users.noreply.github.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = "==3.12.*"
dependencies = [
    "huggingface-hub>=0.34",
    "safetensors>=0.5",
    "tokenizers>=0.22,<0.23",
    "torch>=2.8,<2.9",
]

[project.scripts]
rwkv-publisher = "rwkv_publisher.cli:main"

[dependency-groups]
dev = [
    "jinja2>=3.1,<4",
    "pyright[nodejs]>=1.1.403",
    "pytest>=8.4.1",
    "ruff>=0.12.7",
    "transformers>=4.57,<6",
]

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
extend-exclude = ["src/rwkv_publisher/assets/runtime"]

[tool.ruff.lint]
extend-select = ["I", "UP"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["src/rwkv_publisher/assets/runtime"]
pythonVersion = "3.12"
